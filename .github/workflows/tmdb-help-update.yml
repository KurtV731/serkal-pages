name: TMDB help update

on:
  push:
    branches:
      - website-chatty
    paths:
      - '.github/workflows/tmdb-help-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website-chatty
        uses: actions/checkout@v4
        with:
          ref: website-chatty

      - name: Update TMDB links and download notes
        shell: python
        run: |
          from pathlib import Path

          up = Path('up')

          # Alte Hilfelinks auf die neue Erststarthilfe umstellen.
          for path in up.glob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = text.replace('href="/howtogetapi.html"', 'href="/tmdb-hilfe.html"')
              new = new.replace('href="/howtogetapi-en.html"', 'href="/tmdb-help.html"')
              if new != text:
                  path.write_text(new, encoding='utf-8')

          de_path = up / 'download.html'
          de = de_path.read_text(encoding='utf-8')
          de_marker = '  </section>\n\n  <div class="section">'
          de_note = '''  </section>\n\n  <div class="notice">\n    <strong>Vor der Installation: eigener TMDB-Key</strong>\n    <p>Für TMDB-Suche, Bilder und die TMDB-Wartung benötigt jeder Benutzer ein kostenloses TMDB-Konto und einen eigenen Developer-API-Key. Ein persönlicher Schlüssel von Kurt wird nicht mit SerKal ausgeliefert. Ohne gültigen Key bleiben Archiv und lokale Funktionen verfügbar. <a href="/tmdb-hilfe.html">TMDB-Key vorbereiten</a>.</p>\n  </div>\n\n  <div class="section">'''
          if 'Vor der Installation: eigener TMDB-Key' not in de:
              if de_marker not in de:
                  raise SystemExit('Marker in download.html nicht gefunden')
              de = de.replace(de_marker, de_note, 1)
              de_path.write_text(de, encoding='utf-8')

          en_path = up / 'download-en.html'
          en = en_path.read_text(encoding='utf-8')
          en_marker = '  </section>\n\n  <div class="section">'
          en_note = '''  </section>\n\n  <div class="notice">\n    <strong>Before installation: your own TMDB key</strong>\n    <p>TMDB search, images and TMDB-based maintenance require each user to have a free TMDB account and their own Developer API key. Kurt's personal key is not included with SerKal. Without a valid key, the archive and local functions remain available. <a href="/tmdb-help.html">Prepare your TMDB key</a>.</p>\n  </div>\n\n  <div class="section">'''
          if 'Before installation: your own TMDB key' not in en:
              if en_marker not in en:
                  raise SystemExit('Marker in download-en.html not found')
              en = en.replace(en_marker, en_note, 1)
              en_path.write_text(en, encoding='utf-8')

          # Bekannte alte Aussagen/Links duerfen nicht mehr vorkommen.
          combined = '\n'.join(p.read_text(encoding='utf-8', errors='ignore') for p in up.glob('*.html'))
          forbidden = [
              'href="/howtogetapi.html"',
              'href="/howtogetapi-en.html"',
              'kein eigenes TMDB-Konto erforderlich',
              'kein eigener API-Key erforderlich',
              'no TMDB account is required',
              'no own API key is required',
          ]
          bad = [item for item in forbidden if item.lower() in combined.lower()]
          if bad:
              raise SystemExit('Veraltete TMDB-Aussagen/Links gefunden: ' + ', '.join(bad))

      - name: Remove one-off workflow
        run: rm .github/workflows/tmdb-help-update.yml

      - name: Commit website-chatty changes
        run: |
          git config user.name "SerKal Website Chatty"
          git config user.email "actions@users.noreply.github.com"
          git add up .github/workflows/tmdb-help-update.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Website: TMDB-Erststarthilfe verlinken und Downloadhinweis ergaenzen"
            git push origin website-chatty
          fi
